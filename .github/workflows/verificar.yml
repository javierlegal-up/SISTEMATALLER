name: Verificar ERP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.txt

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Compilar módulos Python
        run: python -m py_compile app.py servicio_respaldos.py servicio_analitica.py servicio_reportes.py servicio_seguridad.py servicio_ordenes.py servicio_inventario.py persistencia.py exportar_excel.py verificar_inicio.py test_app.py test_servicio_seguridad.py test_servicio_ordenes.py test_servicio_inventario.py

      - name: Compilar estilos
        run: npm run build:css

      - name: Ejecutar suite funcional
        run: python -m unittest -v
